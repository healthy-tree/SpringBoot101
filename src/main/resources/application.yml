# ==================== 应用基础配置 ====================
spring:
  application:
    name: spring-boot-101-statemachine

server:
  port: 8080
  servlet:
    context-path: /

# ==================== 日志配置 ====================
logging:
  level:
    root: INFO
    com.example.springboot: DEBUG
    org.springframework: INFO
    org.hibernate: INFO
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss} - %msg%n'
  file:
    name: logs/spring-boot-101.log

# ==================== 数据源选择配置 ====================
# 数据源类型: mysql 或 mongodb (默认 mysql)
datasource:
  type: mysql
  primary: mysql
  enable-migration: false

# ==================== MySQL 配置（默认主数据源） ====================
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/spring_boot_101?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=utf8mb4
    username: root
    password: '123456'
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 连接池配置
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000
      connection-test-query: 'SELECT 1'
      leak-detection-threshold: 60000

# ==================== JPA Hibernate 配置 ====================
  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
        generate_statistics: false
        dialect: org.hibernate.dialect.MySQL8Dialect
        enable_lazy_load_no_trans: true

# ==================== MongoDB 配置（可选，用于迁移） ====================
# MongoDB 连接字符串（当 datasource.type=mongodb 时启用）
  data:
    mongodb:
      uri: mongodb://localhost:27017/spring_boot_101
      database: spring_boot_101
      auto-index-creation: true
      authentication-database: admin

# ==================== Spring Statemachine 配置 ====================
# 状态机的初始状态
  statemachine:
    initial-state: PENDING_PAYMENT

# ==================== Jackson JSON 配置 ====================
  jackson:
    serialization:
      write-dates-as-timestamps: false
      indent-output: true
    time-zone: GMT+8
    default-property-inclusion: non_null

# ==================== Actuator 监控配置 ====================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    enable:
      jvm: true
      process: true

# ==================== H2 内存数据库配置（仅用于测试） ====================
# 如需使用 H2 进行测试，取消注释以下配置并注释 MySQL 配置
# spring:
#   datasource:
#     url: jdbc:h2:mem:testdb
#     driver-class-name: org.h2.Driver
#     username: sa
#     password: ''
#   jpa:
#     database-platform: org.hibernate.dialect.H2Dialect
#   h2:
#     console:
#       enabled: true
#       path: /h2-console

# ==================== 迁移相关说明 ====================
# 启用双数据源模式用于 MongoDB 到 MySQL 的迁移：
# 1. 将 datasource.enable-migration 设置为 true
# 2. 确保 MongoDB 和 MySQL 都已配置并可访问
# 3. 调用迁移 API 进行数据迁移
# 迁移完成后，可将 datasource.type 设置为 mysql，并将 datasource.enable-migration 改为 false
