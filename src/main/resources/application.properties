# ==================== 应用基础配置 ====================
spring.application.name=spring-boot-101-statemachine
server.port=8080
server.servlet.context-path=/

# ==================== 日志配置 ====================
logging.level.root=INFO
logging.level.com.example.springboot=DEBUG
logging.level.org.springframework=INFO
logging.level.org.hibernate=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.file.name=logs/spring-boot-101.log

# ==================== 数据源选择配置 ====================
# 数据源类型: mysql 或 mongodb (默认 mysql)
datasource.type=mysql
datasource.primary=mysql
datasource.enable-migration=false

# ==================== MySQL 配置（默认主数据源） ====================
spring.datasource.url=jdbc:mysql://localhost:3306/spring_boot_101?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=utf8mb4
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 连接池配置
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.leak-detection-threshold=60000

# ==================== JPA Hibernate 配置 ====================
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.generate_statistics=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true

# ==================== MongoDB 配置（可选，用于迁移） ====================
# MongoDB 连接字符串（当 datasource.type=mongodb 时启用）
spring.data.mongodb.uri=mongodb://localhost:27017/spring_boot_101
spring.data.mongodb.database=spring_boot_101
spring.data.mongodb.auto-index-creation=true
spring.data.mongodb.authentication-database=admin

# ==================== Spring Statemachine 配置 ====================
# 状态机的初始状态
spring.statemachine.initial-state=PENDING_PAYMENT

# ==================== Jackson JSON 配置 ====================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=GMT+8
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.indent-output=true

# ==================== H2 内存数据库配置（仅用于测试） ====================
# 如需使用 H2 进行测试，取消注释以下配置并注释 MySQL 配置
# spring.datasource.url=jdbc:h2:mem:testdb
# spring.datasource.driver-class-name=org.h2.Driver
# spring.datasource.username=sa
# spring.datasource.password=
# spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# spring.h2.console.enabled=true
# spring.h2.console.path=/h2-console

# ==================== Actuator 监控配置 ====================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.metrics.enable.jvm=true
management.metrics.enable.process=true

# ==================== 迁移相关说明 ====================
# 启用双数据源模式用于 MongoDB 到 MySQL 的迁移：
# 1. 将 datasource.enable-migration 设置为 true
# 2. 确保 MongoDB 和 MySQL 都已配置并可访问
# 3. 调用迁移 API 进行数据迁移
# 迁移完成后，可将 datasource.type 设置为 mysql，并将 datasource.enable-migration 改为 false
