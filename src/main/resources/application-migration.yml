# ==================== 迁移专用环境配置 ====================
# 此配置用于 MongoDB 到 MySQL 的迁移过程
# 启用双数据源模式，同时运行 MySQL 和 MongoDB
# 使用方法: mvn spring-boot:run -Dspring.profiles.active=migration

spring:
  application:
    name: spring-boot-101-statemachine-migration

server:
  port: 8080
  servlet:
    context-path: /

# ==================== 日志配置（迁移调试） ====================
logging:
  level:
    root: INFO
    com.example.springboot: DEBUG
    com.example.springboot.service.MigrationService: DEBUG
    com.example.springboot.service.OrderService: DEBUG
    com.example.springboot.repository: DEBUG
    org.springframework.data.mongodb: INFO
    org.springframework.data.jpa: INFO
    org.hibernate: WARN
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [%logger{36}] - %msg%n'
  file:
    name: logs/spring-boot-101-migration.log
    max-size: 50MB
    max-history: 30

# ==================== 迁移双数据源配置 ====================
datasource:
  type: mysql
  primary: mysql
  enable-migration: true

# ==================== MySQL 配置（迁移目标数据库） ====================
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/spring_boot_101?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=utf8mb4&useJDBCCompliantTimezoneShift=true&useLegacyDatetimeCode=false
    username: root
    password: '123456'
    driver-class-name: com.mysql.cj.jdbc.Driver

    # HikariCP 连接池迁移优化配置
    hikari:
      maximum-pool-size: 40
      minimum-idle: 15
      connection-timeout: 30000
      idle-timeout: 900000
      max-lifetime: 1800000
      connection-test-query: 'SELECT 1'
      leak-detection-threshold: 60000
      auto-commit: true
      connection-init-sql: 'SET NAMES utf8mb4'

# ==================== JPA Hibernate 迁移配置 ====================
  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        use_sql_comments: false
        jdbc:
          batch_size: 100
          fetch_size: 100
        order_inserts: true
        order_updates: true
        generate_statistics: false
        dialect: org.hibernate.dialect.MySQL8Dialect
        enable_lazy_load_no_trans: true
        # 迁移过程中禁用缓存
        cache:
          use_second_level_cache: false
        cache:
          use_query_cache: false
    open-in-view: false

# ==================== MongoDB 配置（迁移源数据库） ====================
  data:
    mongodb:
      # MongoDB 连接字符串
      uri: mongodb://localhost:27017/spring_boot_101
      database: spring_boot_101

      # 自动创建索引
      auto-index-creation: true

      # 认证数据库
      authentication-database: admin

      # 连接池配置
      connection-string: mongodb://localhost:27017/spring_boot_101

# ==================== Spring Statemachine 配置 ====================
  statemachine:
    initial-state: PENDING_PAYMENT

# ==================== Jackson JSON 配置 ====================
  jackson:
    serialization:
      write-dates-as-timestamps: false
      indent-output: false
    time-zone: GMT+8
    default-property-inclusion: non_null
    date-format: yyyy-MM-dd HH:mm:ss

# ==================== 线程池配置（迁移优化） ====================
  task:
    execution:
      pool:
        core-size: 10
        max-size: 20
        queue-capacity: 500
      thread-name-prefix: migration-
    scheduling:
      pool:
        size: 5
      thread-name-prefix: schedule-

# ==================== Actuator 监控配置 ====================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  metrics:
    enable:
      jvm: true
      process: true
      system: true
      logback: true
    export:
      prometheus:
        enabled: true

# ==================== 服务器优化配置（迁移） ====================
server:
  tomcat:
    threads:
      max: 300
      min-spare: 20
    accept-count: 200
    connection-timeout: 30000ms
    max-http-post-size: 10MB
  compression:
    enabled: true
    min-response-size: 1024

# ==================== 迁移特定说明 ====================
# 重要配置项说明：
#
# 1. datasource.enable-migration: true
#    启用双数据源模式，同时使用 MongoDB 和 MySQL
#
# 2. spring.datasource.hikari.maximum-pool-size: 40
#    增大连接池以处理迁移过程中的并发操作
#
# 3. spring.jpa.properties.hibernate.jdbc.batch_size: 100
#    增大批量处理大小以提高迁移性能
#
# 4. logging.level.com.example.springboot.service.MigrationService: DEBUG
#    开启迁移服务的调试日志以追踪迁移进度
#
# 5. 日志文件: logs/spring-boot-101-migration.log
#    单独的迁移日志文件，便于问题排查
#
# ==================== 迁移流程 ====================
# 1. 确保 MongoDB 和 MySQL 都在运行
# 2. 使用此配置启动应用
# 3. 调用迁移 API 进行数据迁移：
#    - GET  /api/orders/migration/progress        查看迁移进度
#    - POST /api/orders/migration/migrate-by-customer/{customerId}  灰度迁移
#    - POST /api/orders/migration/migrate-all      全量迁移
#    - GET  /api/orders/migration/validate         数据验证
#    - POST /api/orders/migration/rollback         回滚迁移
# 4. 迁移完成后，切换到 application-mysql.yml
#
# ==================== 性能调优建议 ====================
# - 根据服务器资源调整 maximum-pool-size
# - 根据网络情况调整 batch_size
# - 监控 MongoDB 和 MySQL 的 CPU 和内存使用率
# - 在非高峰时段进行迁移
# - 保留充足的磁盘空间用于日志和数据库
