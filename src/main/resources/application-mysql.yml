# ==================== MySQL 专用环境配置 ====================
# 此配置用于生产环境，仅使用 MySQL
# 使用方法: mvn spring-boot:run -Dspring.profiles.active=mysql

spring:
  application:
    name: spring-boot-101-statemachine

server:
  port: 8080
  servlet:
    context-path: /

# ==================== 日志配置 ====================
logging:
  level:
    root: WARN
    com.example.springboot: INFO
    org.springframework: WARN
    org.hibernate: WARN
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n'
  file:
    name: logs/spring-boot-101.log
    max-size: 10MB
    max-history: 30

# ==================== MySQL 生产配置 ====================
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/spring_boot_101?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=utf8mb4&useJDBCCompliantTimezoneShift=true&useLegacyDatetimeCode=false
    username: root
    password: '123456'
    driver-class-name: com.mysql.cj.jdbc.Driver

    # HikariCP 连接池生产配置
    hikari:
      maximum-pool-size: 30
      minimum-idle: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-test-query: 'SELECT 1'
      leak-detection-threshold: 60000
      auto-commit: true
      connection-init-sql: 'SET NAMES utf8mb4'

# ==================== JPA Hibernate 生产配置 ====================
  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        use_sql_comments: false
        jdbc:
          batch_size: 30
          fetch_size: 50
        order_inserts: true
        order_updates: true
        generate_statistics: false
        dialect: org.hibernate.dialect.MySQL8Dialect
        enable_lazy_load_no_trans: true
        # 缓存配置
        cache:
          use_second_level_cache: false
        # 查询缓存
        cache:
          use_query_cache: false
    open-in-view: false

# ==================== Jackson JSON 配置 ====================
  jackson:
    serialization:
      write-dates-as-timestamps: false
      indent-output: false
    time-zone: GMT+8
    default-property-inclusion: non_null
    date-format: yyyy-MM-dd HH:mm:ss

# ==================== 数据源配置 ====================
datasource:
  type: mysql
  primary: mysql
  enable-migration: false

# ==================== Actuator 监控配置 ====================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  metrics:
    enable:
      jvm: true
      process: true
      system: true
    export:
      prometheus:
        enabled: true

# ==================== 服务器优化配置 ====================
server:
  tomcat:
    threads:
      max: 200
      min-spare: 10
    accept-count: 100
    connection-timeout: 20000ms
    max-http-post-size: 2MB
  compression:
    enabled: true
    min-response-size: 1024
